name: Deploy LetItRide Casino 🎰

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔐 Conexión a la red privada
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci 

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Automated Tests
        run: npm test

      # 🚢 SSH a través del túnel de Tailscale
      - name: Deploy via SSH
        if: success() 
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }} # IP Tailscale (100.x.x.x)
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/LetItRide
            
            # Sincronización total con el repo
            git fetch origin main
            git reset --hard origin/main
            
            # Instalación limpia para producción
            npm install --production
            
            # Reinicio inteligente del proceso
            pm2 restart let-it-ride || pm2 start index.js --name let-it-ride
            pm2 save
            
            echo "✅ Despliegue completado con éxito."