name: Deploy LetItRide Casino 🎰

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔐 1. Conexión a la red privada (Sin esto, el servidor es invisible)
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies (CI)
        run: npm install

      # 🧪 2. Ejecutamos los tests que armamos hoy
      - name: Run Automated Tests
        run: npm test

      # 🚢 3. Despliegue seguro por SSH
      - name: Deploy via SSH
        if: success() 
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -x
            cd ~/LetItRide
            
            # Limpieza de procesos viejos
            pm2 stop let-it-ride || true
            
            # Sincronización de código
            git fetch origin
            git reset --hard origin/main
            
            # Instalación limpia
            npm install --production
            
            # Inicio del bot de casino en puerto 3001
            pm2 start index.js --name let-it-ride || pm2 restart let-it-ride
            pm2 save
            
            echo "✅ Deploy de Casino exitoso - $(date)"