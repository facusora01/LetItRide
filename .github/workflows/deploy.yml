name: Deploy LetItRide Casino 🎰

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Conectar a Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci 

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy via SSH
        if: success() 
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/LetItRide
            
            # 1. ACTUALIZACIÓN SIN BORRAR SESIONES
            git fetch origin main
            # Si usas bases de datos o sesiones en esta carpeta, 
            # asegurate que estén en el .gitignore antes de hacer esto:
            git reset --hard origin/main
            
            # 2. INSTALACIÓN LIMPIA
            npm ci --omit=dev
            
            # 3. REINICIO CON AUMENTO DE MEMORIA (FIX PARA EL 91% HEAP)
            # Le asignamos 512MB de RAM explícitamente para evitar el lag
            pm2 delete let-it-ride || true
            pm2 start index.js --name let-it-ride
            
            # 4. PERSISTENCIA
            pm2 save
            
            echo "✅ Despliegue completado y memoria optimizada."