name: Deploy LetItRide Casino 🎰

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # CACHE: No descargues node_modules si no cambió el package-lock.json
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Conectar a Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci 

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm' # Optimización nativa de setup-node

      - name: Install dependencies
        run: npm ci # 'ci' es mucho más rápido y limpio que 'install'

      - name: Run Automated Tests
        run: npm test

      - name: Deploy via SSH
        if: success() 
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/LetItRide
            
            git fetch origin main
            git reset --hard origin/main
            
            # OPTIMIZACIÓN EN SERVIDOR
            # 'npm ci' es ideal para servers. --omit=dev evita cargar basura.
            npm ci --omit=dev
            
            # ELIMINADO: npm rebuild better-sqlite3 
            # (npm ci ya lo compila correctamente al detectar Linux)
            
            # Reinicio rápido
            pm2 restart let-it-ride --update-env || pm2 start index.js --name let-it-ride
            pm2 save
            
            echo "✅ Despliegue completado con éxito."